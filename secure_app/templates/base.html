<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SECURE APP{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">

  <nav class="bg-white shadow">
    <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between">
      <a href="/" class="font-bold text-green-700">ChekaSafe</a>
      <a href="/report/" class="text-red-600 font-medium">Report a scam</a>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-4 py-8">
    {% for message in messages %}
      <div class="mb-4 p-3 rounded bg-blue-100 text-blue-800">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>

</body>
</html>
